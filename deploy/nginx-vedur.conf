# Bæta inn í server-blokkina fyrir bjornlevi.is

  location = /vedur {
    return 301 /vedur/;
  }

  # Proxy the app
  location /vedur/ {
    proxy_pass http://127.0.0.1:8019;  # NO trailing slash
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Script-Name /vedur;
  }
